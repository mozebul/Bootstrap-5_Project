<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FoodCollections | Add Restaurant</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body class="soft-section"><nav class="navbar navbar-dark bg-dark sticky-top"><div class="container"><a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-egg-fried text-danger me-2"></i>FoodCollections</a><div><a href="restaurants.html" class="btn btn-outline-light btn-sm me-2">Restaurants</a><a href="index.html" class="btn btn-brand btn-sm">Home</a></div></div></nav><main class="py-5"><div class="container"><div class="row justify-content-center"><div class="col-xl-9"><div class="card form-card p-4 p-md-5"><div class="mb-4"><span class="section-label">For business owners</span><h1 class="fw-bold">Add Your Restaurant</h1><p class="text-muted">Share your restaurant details and help food lovers discover you.</p></div><form data-demo-form data-message="Restaurant submitted successfully (demo only)."><div class="row g-3"><div class="col-md-6"><label class="form-label">Restaurant Name</label><input class="form-control" required placeholder="e.g. Food House"></div><div class="col-md-6"><label class="form-label">Owner Name</label><input class="form-control" required placeholder="Your name"></div><div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" required placeholder="owner@example.com"></div><div class="col-md-6"><label class="form-label">Phone</label><input type="tel" class="form-control" required placeholder="01XXXXXXXXX"></div><div class="col-md-6"><label class="form-label">Category</label><select class="form-select" required><option value="">Choose category</option><option>Burger</option><option>Japanese</option><option>Dessert</option><option>Pizza</option><option>Cafe</option><option>Other</option></select></div><div class="col-md-6"><label class="form-label">Price Range</label><select class="form-select" required><option value="">Choose price</option><option>Budget</option><option>Mid Range</option><option>Premium</option></select></div><div class="col-12"><label class="form-label">Address</label><input class="form-control" required placeholder="Restaurant address"></div><div class="col-12"><label class="form-label">Description</label><textarea class="form-control" rows="5" required placeholder="Tell customers about your restaurant..."></textarea></div><div class="col-12"><button class="btn btn-brand btn-lg px-4"><i class="bi bi-send me-2"></i>Submit Restaurant</button></div></div><div class="form-message"></div></form></div></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/script.js"></script></body></html>
